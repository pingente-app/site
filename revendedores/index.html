<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>pingente — resellers</title>
  <!-- URL antiga (pt). O site passou a ser inglês na raiz e /pt/ para português (2026-09-08). -->

  <link rel="canonical" href="https://pingente.app/resellers/">
  <meta http-equiv="refresh" content="0; url=/resellers/">

    (function () {
      var p = (navigator.language || 'en').toLowerCase();
      var prefix = p.indexOf('pt') === 0 ? '/pt' : p.indexOf('es') === 0 ? '/es' : '';
      location.replace(prefix + '/resellers/' + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>Moved: <a href="/resellers/">pingente.app/resellers</a> · <a href="/pt/resellers/">português</a> · <a href="/es/resellers/">español</a></p>
